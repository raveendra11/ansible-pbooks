---
# roles/k8s_addons/tasks/main.yml
# Post-cluster Kubernetes configuration — runs AFTER Terraform + kubectl setup.
# Installs cluster-wide add-ons: ingress controller, cert-manager, namespaces.

# ── Namespaces ──────────────────────────────────────────────────────────────

- name: Create required namespaces
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ item.name }}"
    state: present
    resource_definition:
      metadata:
        labels: "{{ item.labels | default({}) }}"
  loop: "{{ k8s_namespaces }}"
  tags: [namespaces]

# ── Ingress-nginx ────────────────────────────────────────────────────────────

- name: Install ingress-nginx via Helm
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    chart_version: "{{ ingress_nginx_chart_version }}"
    release_namespace: ingress-nginx
    create_namespace: false             # namespace created above
    values: "{{ ingress_nginx_values }}"
    wait: true
    timeout: 5m0s
  tags: [ingress]

- name: Wait for ingress-nginx controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: ingress-nginx-controller
    namespace: ingress-nginx
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  tags: [ingress, verify]

# ── Cert-manager ─────────────────────────────────────────────────────────────

- name: Install cert-manager CRDs
  ansible.builtin.command: >
    kubectl apply -f
    https://github.com/cert-manager/cert-manager/releases/download/v{{ cert_manager_chart_version }}/cert-manager.crds.yaml
  changed_when: false
  tags: [cert-manager]

- name: Install cert-manager via Helm
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: cert-manager
    create_namespace: false
    values:
      installCRDs: false              # installed separately above
      global:
        leaderElection:
          namespace: cert-manager
    wait: true
    timeout: 5m0s
  tags: [cert-manager]

- name: Apply ClusterIssuer for Let's Encrypt
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_issuer }}"
      spec:
        acme:
          server: >-
            {% if cert_manager_issuer == 'letsencrypt-prod' %}
            https://acme-v02.api.letsencrypt.org/directory
            {% else %}
            https://acme-staging-v02.api.letsencrypt.org/directory
            {% endif %}
          email: "{{ cert_manager_email }}"
          privateKeySecretRef:
            name: "{{ cert_manager_issuer }}-key"
          solvers:
            - http01:
                ingress:
                  class: nginx
  tags: [cert-manager]

# ── RBAC ─────────────────────────────────────────────────────────────────────

- name: Apply read-only ClusterRole for developers
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: developer-read-only
        labels:
          managed-by: ansible
      rules:
        - apiGroups: [""]
          resources: ["pods", "services", "endpoints", "namespaces"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources: ["deployments", "replicasets"]
          verbs: ["get", "list", "watch"]
  tags: [rbac]
