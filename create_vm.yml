- name: Create GCP Compute Engine VM
  hosts: local
  gather_facts: no
  collections:
    - google.cloud

  vars:
    project_id: "YOUR_GCP_PROJECT_ID"
    zone: "us-central1-a"
    machine_type: "e2-medium"
    instance_name: "ansible-vm"
    image_family: "debian-11"
    image_project: "debian-cloud"

  tasks:

    - name: Create VM instance
      google.cloud.gcp_compute_instance:
        name: "{{ instance_name }}"
        machine_type: "zones/{{ zone }}/machineTypes/{{ machine_type }}"
        zone: "{{ zone }}"
        project: "{{ project_id }}"

        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "projects/{{ image_project }}/global/images/family/{{ image_family }}"

        network_interfaces:
          - network: "global/networks/default"
            access_configs:
              - name: "External NAT"
                type: "ONE_TO_ONE_NAT"

        state: present
      register: vm_output

    - name: Show VM details
      debug:
        var: vm_output
