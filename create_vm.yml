- name: Create GCP VM and configure it
  hosts: localhost
  gather_facts: no
  collections:
    - google.cloud

  vars:
    project_id: "YOUR_GCP_PROJECT_ID"
    zone: "us-central1-a"
    machine_type: "e2-medium"
    instance_name: "ansible-vm"
    image_family: "debian-11"
    image_project: "debian-cloud"
    ssh_user: "YOUR_USERNAME"

  tasks:

    - name: Create VM instance
      google.cloud.gcp_compute_instance:
        name: "{{ instance_name }}"
        machine_type: "zones/{{ zone }}/machineTypes/{{ machine_type }}"
        zone: "{{ zone }}"
        project: "{{ project_id }}"

        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "projects/{{ image_project }}/global/images/family/{{ image_family }}"

        network_interfaces:
          - network: "global/networks/default"
            access_configs:
              - name: "External NAT"
                type: "ONE_TO_ONE_NAT"

        metadata:
          items:
            - key: ssh-keys
              value: "{{ ssh_user }}:{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

        state: present
      register: vm_output

    - name: Wait for SSH to come up
      wait_for:
        host: "{{ vm_output.networkInterfaces[0].accessConfigs[0].natIP }}"
        port: 22
        delay: 10
        timeout: 300

    - name: Add new VM to inventory
      add_host:
        name: gcp_vm
        ansible_host: "{{ vm_output.networkInterfaces[0].accessConfigs[0].natIP }}"
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: "~/.ssh/id_rsa"

- name: Configure VM (Install Nginx)
  hosts: gcp_vm
  become: yes

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
