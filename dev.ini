# inventory/dev.ini
# Dev environment inventory
# Bastion host is the jump server for accessing the private GKE cluster

[bastion]
dev-bastion ansible_host=<DEV_BASTION_IP> ansible_user=ansible

[bastion:vars]
env=dev
gke_cluster_name=myapp-dev-gke
gke_region=us-central1
gcp_project_id=<DEV_PROJECT_ID>

[k8s_config]
# Localhost used for kubectl/helm tasks after bastion configures credentials
localhost ansible_connection=local

[k8s_config:vars]
env=dev
